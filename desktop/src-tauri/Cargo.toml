[package]
name = "promptcut"
version = "0.2.6"
edition = "2021"
authors = []
description = "PromptCut Desktop"
# 这个 crate 是本仓库的应用代码,不发 crates.io。写明之后 cargo-deny 才把它当私有 crate
# 跳过许可证判定(见 deny.toml 的 [licenses.private]),否则每次检查都卡在「自己没有许可证」
publish = false

[lib]
name = "promptcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable:一个窗口里放多个 webview(agent 的浏览器是主窗口里的子 webview,见 agent_webview.rs)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SKILL 悬浮窗下面那张「上一步动作」预览图:壳读 png 再以 data URL 推给悬浮页
base64 = "0.22"

# 下面这一段之后的都是**只在 Windows 上才有的依赖**。往这里加东西之前先想清楚:
# 通用 crate 掉进来的话,非 Windows 目标一编译就是 unresolved import,而本机只发
# Windows 包、cargo build 照样过 —— 错了也要等到别人换平台或者 CI 加交叉检查才发现。
#
# agent 子 webview 的静音要直接调 WebView2 的 ICoreWebView2_8::IsMuted,Tauri 没包这一层。
# 版本跟 tauri 2.11 锁的一致(见 Cargo.lock),不然会出现两份 windows-rs 类型对不上。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Win32_Graphics_Gdi:采样屏幕像素读菜单栏颜色(chrome_color.rs)
# Win32_System_JobObjects + Win32_System_Threading:把 sidecar 拴进 kill-on-close 的
# job object,外壳被强杀时内核照样把它整棵树收走(见 src/kill_on_close.rs)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
