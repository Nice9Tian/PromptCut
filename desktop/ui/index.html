<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptCut</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255, 255, 255, 0.15);
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 28px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .label {
    font-size: 16px;
    color: #b0b0c0;
    letter-spacing: 0.5px;
  }
  #status {
    margin-top: 24px;
    color: #ff6b6b;
    font-size: 14px;
    max-width: 600px;
    text-align: center;
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label">正在启动 PromptCut…</div>
  <div id="status"></div>
</body>
</html>
