<style>

    --pending: #f2b453; --pending-soft: #3a2a0d; --ok: #74d39a; --ok-soft: #11301e; --void: #8d989e; --void-soft: #1d262b;

  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }

/* ---------- reply bar ---------- */

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const ITEMS = DATA.items;
  const BYID = Object.fromEntries(ITEMS.map((it) => [it.id, it]));
  const STORE_KEY = DATA.storeKey || "pc-cai-verdicts-v1";

  const store = {
    load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch { return {}; } },
    save(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch { /* 私密窗口等存不了，页面照常用 */ } },
  };
  let verdicts = store.load();

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // 行内：`代码`、**加粗**
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // 段落与列表：以「- 」「* 」「1. 」开头的行成列表
  const block = (s) => {
    const lines = String(s ?? "").split(/\n/).map((l) => l.trimEnd()).filter((l) => l.trim() !== "");
    let html = "", list = null;
    for (const l of lines) {
      const m = l.match(/^\s*(?:[-*]|\d+[.、])\s+(.*)$/);
      if (m) { if (!list) { list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
      if (list) { html += `<ul>${list.join("")}</ul>`; list = null; }
      html += `<p>${inline(l)}</p>`;
    }
    if (list) html += `<ul>${list.join("")}</ul>`;
    return html;
  };

  const STATUS = [["待审", "pending"], ["已审", "ok"], ["已失效", "void"]];
  const LEVELS = [["二级", "lvl2"], ["三级", "lvl3"]];
  const filt = { status: new Set(["待审"]), level: new Set(), shot: false, q: "" };

  const pillStatus = (s) => { const c = (STATUS.find((x) => x[0] === s) || [s, "void"])[1]; return `<span class="pill ${c}">${esc(s)}</span>`; };
  const pillLevel = (l) => l ? `<span class="pill ${l === "二级" ? "lvl2" : "lvl3"}">${esc(l)}</span>` : "";

  function chip(group, label, pressed, onClick) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", () => { onClick(); b.setAttribute("aria-pressed", String(!(b.getAttribute("aria-pressed") === "true"))); render(); });
    document.getElementById(group).appendChild(b);
  }
  const countBy = (pred) => ITEMS.filter(pred).length;
  for (const [s] of STATUS) chip("f-status", `${s} ${countBy((i) => i.status === s)}`, filt.status.has(s), () => { filt.status.has(s) ? filt.status.delete(s) : filt.status.add(s); });
  for (const [l] of LEVELS) chip("f-level", l, false, () => { filt.level.has(l) ? filt.level.delete(l) : filt.level.add(l); });
  chip("f-shot", `有截图 ${countBy((i) => i.shot)}`, false, () => { filt.shot = !filt.shot; });
  document.getElementById("q").addEventListener("input", (e) => { filt.q = e.target.value.trim().toLowerCase(); render(); });

  const visible = () => ITEMS.filter((i) =>
    (filt.status.size === 0 || filt.status.has(i.status)) &&
    (filt.level.size === 0 || filt.level.has(i.level)) &&
    (!filt.shot || i.shot) &&
    (!filt.q || [i.id, i.title, i.refs, i.what, i.involve].join(" ").toLowerCase().includes(filt.q)));

  // ---------- 页头、页脚 ----------
  const pend = ITEMS.filter((i) => i.status === "待审");
  const eyebrow = document.getElementById("eyebrow");
  eyebrow.textContent = DATA.eyebrow || "";
  eyebrow.hidden = !DATA.eyebrow;
  document.getElementById("title").innerHTML = inline(DATA.title).replace(/[〔〕]/g, (c) => `<span class="bracket">${c}</span>`);
  document.getElementById("lede").innerHTML = block(DATA.lede);
  document.getElementById("tally").innerHTML = [
    `<li class="p"><b>${pend.length}</b>条待审</li>`,
    `<li class="k"><b>${pend.filter((i) => i.level === "二级").length}</b>条二级（你看得出区别）</li>`,
    `<li><b>${countBy((i) => i.status === "已审")}</b>条已审</li>`,
    `<li><b>${countBy((i) => i.status === "已失效")}</b>条已失效</li>`,
  ].join("");
  const built = [DATA.generated && `条目整理于 ${DATA.generated}`, DATA.built && `本页生成于 ${DATA.built}`].filter(Boolean).join("，");
  document.getElementById("scope").innerHTML = (DATA.scope ? `<h2>范围与做法</h2>${block(DATA.scope)}` : "") +
    (built ? `<p class="built">${esc(built)}。</p>` : "");

  // ---------- 清单 ----------
  function render() {
    const list = document.getElementById("list");
    const vis = visible();
    if (!vis.length) { list.innerHTML = `<p class="empty">没有符合筛选的条目。点上面的状态或级别换一个组合。</p>`; return; }
    let html = "";
    for (const area of DATA.areas) {
      const rows = vis.filter((i) => i.area === area.key);
      if (!rows.length) continue;
      html += `<section class="area" aria-labelledby="h-${area.key}"><div class="area-head"><h2 id="h-${area.key}">${esc(area.name)}</h2>` +
        `<span class="count">${rows.length} 条</span><span class="scope">${inline(area.scope)}</span></div><ol class="ledger">`;
      for (const i of rows) {
        const v = verdicts[i.id];
        html += `<li><button type="button" class="row" data-id="${esc(i.id)}"><span class="id">${esc(i.id)}</span>` +
          `<span class="t"><strong>${esc(i.title)}</strong><small>${esc(i.oneLine)}</small></span>` +
          `<span class="tags">${i.decided ? `<span class="pill mine-done">已定：${esc(i.decided.v)}</span>` : v ? `<span class="mine">已选：${esc(v.v)}</span>` : ""}${i.shot ? `<span class="pill shot">截图</span>` : ""}${pillLevel(i.level)}${pillStatus(i.status)}</span></button></li>`;
      }
      html += `</ol></section>`;
    }
    list.innerHTML = html;
  }
  document.getElementById("list").addEventListener("click", (e) => {
    const b = e.target.closest(".row"); if (b) open(b.dataset.id);
  });

  // ---------- 单条 ----------
  const SECTIONS = [
    ["what", "是什么"], ["why", "当时为什么这样定"], ["now", "现在代码怎么做"], ["diff", "修改前 → 修改后"],
    ["visible", "你看得到的差别"], ["options", "选项"], ["shot", "截图"], ["quote", "裁定原文"], ["refs", "出处"],
  ];
  let scrollBack = 0;
  function open(id, push = true) {
    const i = BYID[id]; if (!i) return;
    if (push) scrollBack = window.scrollY;
    const order = visible().map((x) => x.id);
    const idx = order.indexOf(id);
    const prev = idx > 0 ? order[idx - 1] : null, next = idx >= 0 && idx < order.length - 1 ? order[idx + 1] : null;
    const area = DATA.areas.find((a) => a.key === i.area);
    let secs = "";
    for (const [k, label] of SECTIONS) {
      let body = "";
      if (k === "diff") {
        if (i.diff && (i.diff.before || i.diff.after)) {
          body = `<div class="diff">${i.diff.before ? `<div class="before"><b>修改前</b>${block(i.diff.before)}</div>` : ""}${i.diff.after ? `<div class="after"><b>修改后</b>${block(i.diff.after)}</div>` : ""}</div>`;
        } else if (i.diffRaw) body = block(i.diffRaw);
      } else if (k === "shot") {
        if (i.shot) body = `<figure><img src="${esc(i.shot.src)}" alt="${esc(i.shot.alt || i.title)}" loading="lazy"><figcaption><span class="boxkey" aria-hidden="true"></span>${inline(i.shot.caption).replace(/\n+/g, "<br>")}</figcaption></figure>`;
        else if (i.shotNote) body = block(i.shotNote);
      } else if (k === "quote") {
        if (i.quote) body = `<blockquote>${block(i.quote)}</blockquote>`;
      } else if (k === "refs") {
        if (i.refs) body = `<div class="refs">${block(i.refs)}</div>`;
      } else if (i[k]) body = block(i[k]);
      if (body) secs += `<section class="sec"><h3>${label}</h3><div class="body">${body}</div></section>`;
    }
    const v = verdicts[i.id] || {};
    const el = document.getElementById("case");
    el.innerHTML =
      `<div class="case-nav"><button type="button" class="linkbtn" data-act="back">← 回清单</button><span>` +
      `${prev ? `<button type="button" class="linkbtn" data-go="${prev}">← ${esc(prev)}</button> ` : ""}` +
      `${next ? `<button type="button" class="linkbtn" data-go="${next}">${esc(next)} →</button>` : ""}</span></div>` +
      `<header class="case-head"><div class="idline"><span class="bigid">${esc(i.id)}</span>${pillLevel(i.level)}${pillStatus(i.status)}</div>` +
      `<h2>${esc(i.title)}</h2><div class="meta">${esc(area ? area.name : "")}${i.involve ? " · 涉及 " + esc(i.involve) : ""}</div></header>` +
      `<div class="verdict"><div class="rec"><span>建议</span><p>${inline(i.rec || "（没有写建议）")}</p></div>` +
      (i.status === "待审" ? `<div class="vbtns" role="group" aria-label="你的决定">` +
        ["维持", "推翻", "改成", "先不定"].map((x) => `<button type="button" class="vbtn" data-v="${x}" aria-pressed="${v.v === x}">${x}</button>`).join("") +
        `<input class="vnote" id="vnote" type="text" placeholder="补一句（选「改成」时写改成什么）" value="${esc(v.note || "")}"></div>`
        : i.decided ? `<div class="decided"><span>你的决定（${esc(i.decided.date)}）</span><p><strong>${esc(i.decided.v)}</strong>${i.decided.note ? "：" + inline(i.decided.note) : ""}</p></div>`
        : `<div class="meta">这一条${i.status === "已审" ? "你以前已经定过" : "已经被后来的决定取代"}，列在这里备查，不用再回。</div>`) +
      `</div><div class="sections">${secs}</div>`;
    document.getElementById("list").hidden = true;
    document.body.classList.add("in-case");
    el.hidden = false;
    try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch { /* 改不了地址也不影响 */ }
    window.scrollTo(0, 0);
  }
  function back() {
    document.getElementById("case").hidden = true;
    document.getElementById("list").hidden = false;
    document.body.classList.remove("in-case");
    render();
    try { history.replaceState(null, "", location.pathname + location.search); } catch { }
    window.scrollTo(0, scrollBack);
  }
  document.getElementById("case").addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-act=back]")) return back();
    const go = t.closest("[data-go]"); if (go) return open(go.dataset.go, false);
    const vb = t.closest(".vbtn");
    if (vb) {
      const id = document.querySelector(".bigid").textContent;
      const cur = verdicts[id];
      if (cur && cur.v === vb.dataset.v) delete verdicts[id];
      else verdicts[id] = { v: vb.dataset.v, note: (document.getElementById("vnote") || {}).value || "" };
      store.save(verdicts);
      document.querySelectorAll(".vbtn").forEach((b) => b.setAttribute("aria-pressed", String(!!verdicts[id] && verdicts[id].v === b.dataset.v)));
      syncBar();
      return;
    }
    const img = t.closest("figure img");
    if (img) { const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${img.getAttribute("src")}" alt="${esc(img.alt)}">`; lb.addEventListener("click", () => lb.remove()); document.body.appendChild(lb); }
  });
  document.getElementById("case").addEventListener("input", (e) => {
    if (e.target.id !== "vnote") return;
    const id = document.querySelector(".bigid").textContent;
    verdicts[id] = { v: (verdicts[id] && verdicts[id].v) || "改成", note: e.target.value };
    store.save(verdicts);
    document.querySelectorAll(".vbtn").forEach((b) => b.setAttribute("aria-pressed", String(verdicts[id].v === b.dataset.v)));
    syncBar();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const lb = document.querySelector(".lightbox"); if (lb) lb.remove(); else if (!document.getElementById("case").hidden) back(); } });

  // ---------- 回复条 ----------
  const replyText = () => ITEMS.filter((i) => verdicts[i.id]).map((i) => {
    const v = verdicts[i.id];
    if (v.v === "改成") return `${i.id} 改成：${v.note || "（没写）"}`;
    return `${i.id} ${v.v}${v.note ? "：" + v.note : ""}`;
  }).join("\n");
  function syncBar() {
    const n = Object.keys(verdicts).filter((k) => BYID[k]).length;
    const bar = document.getElementById("replybar");
    bar.hidden = n === 0;
    document.getElementById("replysum").textContent = `已选 ${n} 条（${pend.length} 条待审里）`;
  }
  document.getElementById("copyreply").addEventListener("click", async () => {
    const text = replyText();
    const ta = document.getElementById("replytext");
    const toast = document.getElementById("toast");
    try { await navigator.clipboard.writeText(text); toast.textContent = "已复制，贴回对话即可"; ta.hidden = true; }
    catch { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); toast.textContent = "浏览器不让直接复制，文字已选中，按 Ctrl+C"; }
  });
  document.getElementById("clearall").addEventListener("click", () => { verdicts = {}; store.save(verdicts); syncBar(); render(); document.getElementById("toast").textContent = ""; });

  render();
  syncBar();
  const h = (location.hash || "").replace(/^#/, "");
  if (h && BYID[h]) open(h);
})();
</script>
