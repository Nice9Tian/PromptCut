# C10 契约第 2 节：在线普通档的两个舞台源（与编辑器页同站跨源）。只提供舞台页（/editor 的同一份在线构建）、/media 反代、
# 凭 cookie 读素材的 /media-s/ 与自检用的 /editor/_iso/。其它路径一律 404。
#
# 在线执行用户卡与图卡的隔离（docs/plan/online-card-exec-contract.md 第 3.3、4.1 节）：
#   - 舞台源上的每个响应都带 snippets/promptcut-stage-headers.conf 里的头：内容安全策略、出口白名单（Connection-Allowlist，
#     拦 WebRTC）、关 DNS 预解析，以及原有的 Origin-Agent-Cluster、Referrer-Policy、X-Content-Type-Options。
#     那个片段由 scripts/gen-stage-policy-nginx.mjs 从 src/online/stagePolicy.mjs 生成，放到 /etc/nginx/snippets/ 下，不要手改。
#     nginx 的 add_header 不跨层合并（location 里有一条就不继承 server 层的），所以每个 location 各 include 一次。
#   - /media-s/<sid>/_grant：编辑器页把只读素材票据交来，换成 HttpOnly cookie（卡片代码读不到）；只认编辑器页的源。
#   - /media-s/<sid>/media/<哈希>：凭 cookie 读素材，nginx 把 cookie 换成 Authorization 头转给素材服务；只放行 GET / HEAD。
#     素材服务不改。原来的 /media 路由保留（旧版页面与没隔离的舞台照旧带 ?t= 读）。
#   - /editor/_iso/ok、/editor/_iso/redirect：舞台自检用（出口白名单生效时同源的重定向也被浏览器拦下，页面据此判断它在不在生效）。

# 交接请求里的票据（形状 v1.<base64url>.<base64url>）；不是这个形状给空串
map $http_authorization $pc_grant_ticket {
  default "";
  "~^Bearer (?<pc_gt>v1\.[A-Za-z0-9_-]{1,1600}\.[A-Za-z0-9_-]{1,200})$" $pc_gt;
}
# 只有「编辑器页的源发来的 POST、票据形状对」才发 cookie；值为空串时 nginx 不发这个头
map "$request_method|$http_origin|$pc_grant_ticket" $pc_grant_cookie {
  default "";
  "~^POST\|https://{{DOMAIN}}\|(?<pc_gt2>v1\..+)$" "pc_rt=$pc_gt2; Path=/media-s/$pc_sid/; HttpOnly; Secure; SameSite=Strict; Max-Age=900";
}

server {
  listen 443 ssl;
  server_name s1.{{DOMAIN}} s2.{{DOMAIN}};
  ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location /media { rewrite ^/media/?(.*)$ /$1 break; proxy_bind {{BIND_ADDR}}; proxy_pass http://{{BIND_ADDR}}:8788; client_max_body_size 2g;
                    proxy_request_buffering off; proxy_read_timeout 600s;
                    include snippets/promptcut-stage-headers.conf; }

  # 票据换 cookie。预检与交接都只对编辑器页的源开（带凭据的跨源请求，Allow-Origin 不能是 *）。
  location ~ "^/media-s/(?<pc_sid>[A-Za-z0-9]{16,64})/_grant$" {
    include snippets/promptcut-stage-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "https://{{DOMAIN}}" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "authorization" always;
    add_header Access-Control-Allow-Methods "POST" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Vary "Origin" always;
    add_header Set-Cookie $pc_grant_cookie always;
    # if 里只有 return，是 nginx 文档认可的安全用法
    if ($http_origin != "https://{{DOMAIN}}") { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($pc_grant_ticket = "") { return 400; }
    return 204;
  }
  # 凭 cookie 读素材：只放行按哈希寻址的素材字节，只放行 GET / HEAD；cookie 换成 Authorization 头，cookie 本身不转给素材服务。
  location ~ "^/media-s/(?<pc_sid>[A-Za-z0-9]{16,64})/(?<pc_mpath>media/[0-9a-f]{64}(?:\.[A-Za-z0-9]{1,8})?)$" {
    include snippets/promptcut-stage-headers.conf;
    limit_except GET HEAD { deny all; }
    if ($cookie_pc_rt = "") { return 401; }
    proxy_bind {{BIND_ADDR}}; proxy_pass http://{{BIND_ADDR}}:8788/$pc_mpath;
    proxy_set_header Authorization "Bearer $cookie_pc_rt";
    proxy_set_header Cookie "";
    proxy_read_timeout 600s;
  }
  # 形状不对的 /media-s/ 路径一律 404。不能写 ^~（那样上面两条正则就不查了）；有了这条前缀，/media-s/ 也不会落进 /media 那条反代
  location /media-s/ { include snippets/promptcut-stage-headers.conf; return 404; }

  # 舞台自检：前者回 204，后者重定向到前者
  location = /editor/_iso/ok { include snippets/promptcut-stage-headers.conf; add_header Cache-Control "no-store" always; return 204; }
  location = /editor/_iso/redirect { include snippets/promptcut-stage-headers.conf; add_header Cache-Control "no-store" always; return 302 /editor/_iso/ok; }

  location = /editor { root /opt/promptcut-hosted; default_type text/html; try_files /editor/index.html =404;
                    add_header Cache-Control "no-store" always; include snippets/promptcut-stage-headers.conf; }
  location = /editor/index.html { root /opt/promptcut-hosted;
                    add_header Cache-Control "no-store" always; include snippets/promptcut-stage-headers.conf; }
  # 舞台入口（在线构建产出的 stage.html：同一份脚本包，带 <meta> 兜底的策略）。跨源舞台的 iframe 载它
  location = /editor/stage.html { root /opt/promptcut-hosted;
                    add_header Cache-Control "no-store" always; include snippets/promptcut-stage-headers.conf; }
  location ^~ /editor/assets/ { root /opt/promptcut-hosted; gzip_static on; try_files $uri =404;
                    add_header Cache-Control "public, max-age=31536000, immutable" always; include snippets/promptcut-stage-headers.conf; }
  location /editor/ { root /opt/promptcut-hosted; try_files $uri /editor/index.html;
                    add_header Cache-Control "no-store" always; include snippets/promptcut-stage-headers.conf; }
  # 动效素材目录（server/online-catalog.mjs：在线构建把 server/catalog/<kind>/index.json 登记的 Lottie、粒子文件产出到 editor/catalog/）。
  # 卡片参数里存的是同源绝对路径 /catalog/<kind>/<名>.json（桌面由开发服务器中间件提供），在线由这里提供。
  # 主站（编辑器页的源）与 s1/s2 两个舞台源的 server 块里各加一份（舞台 iframe 里的 fetch 解析到舞台自己的源）。
  # 只放行 /catalog/(lottie|particles)/<[A-Za-z0-9-]+>.json，与桌面中间件的形状相同；其余 /catalog/… 一律 404（不列目录、不给 index.json）。
  # if 里只有 return，是 nginx 文档认可的安全用法。缓存用 no-cache（文件名不带哈希，换代后靠 ETag / Last-Modified 重新验证，同桌面中间件）。
  location ^~ /catalog/ {
    root /opt/promptcut-hosted/editor;
    if ($uri !~ "^/catalog/(lottie|particles)/[A-Za-z0-9-]+\.json$") { return 404; }
    try_files $uri =404;
    charset utf-8; charset_types application/json;
    add_header Cache-Control "no-cache" always; include snippets/promptcut-stage-headers.conf;
  }
  location / { include snippets/promptcut-stage-headers.conf; return 404; }
}
