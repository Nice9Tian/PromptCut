# 文档服务的补充配置:它每次启动完,顺手把素材服务的观察通道重建一次。
# 模板 server/hosted/deploy/systemd-promptcut-doc-rotate.dropin.conf;
# 放在 /etc/systemd/system/promptcut-doc-v2.service.d/rotate.conf,再 systemctl daemon-reload。
#
# 以前这一步要人工记着做(「每重启一次 promptcut-doc-v2 就跟着跑一次 publisher --rotate」),
# 2026-10-23 漏做了一次:观察通道丢了,而且当时一丢就把整个素材服务拖成 not-ready,
# 连普通用户加载素材都 503,只好把 PROMPTCUT_ASSET_RUN_ENABLED 改成 0 换回素材服务可用。
# 有了这一条,重启文档服务不用再记着补这一步。
#
# --no-block 是必须的:rotate 单元会 stop + start 素材服务,不加它 systemd 会在文档服务的启动过程里
# 等一个要动别的服务的单元,自己把自己锁住。
[Service]
ExecStartPost=/usr/bin/systemctl --no-block start promptcut-asset-rotate.service
