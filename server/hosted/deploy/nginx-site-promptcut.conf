server {
  server_name {{DOMAIN}};
  location /hosted { rewrite ^/hosted/?(.*)$ /$1 break; proxy_bind {{BIND_ADDR}}; proxy_pass http://{{BIND_ADDR}}:8787;
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_read_timeout 3600s; proxy_send_timeout 3600s; client_max_body_size 2m; proxy_buffering off; }
  location /media { rewrite ^/media/?(.*)$ /$1 break; proxy_bind {{BIND_ADDR}}; proxy_pass http://{{BIND_ADDR}}:8788; client_max_body_size 2g;
                      proxy_request_buffering off; proxy_read_timeout 600s; }
  # C10a 在线编辑器(docs/plan/c10a-contract.md 第 2 节):静态文件,不经过 Node;/editor 直接回 200、不做首跳重定向(免得丢 # 片段)
  location = /editor { root /opt/promptcut-hosted; default_type text/html; try_files /editor/index.html =404;
                      add_header Cache-Control "no-store" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Origin-Agent-Cluster "?1" always; }
  location = /editor/index.html { root /opt/promptcut-hosted;
                      add_header Cache-Control "no-store" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Origin-Agent-Cluster "?1" always; }
  location ^~ /editor/assets/ { root /opt/promptcut-hosted; gzip_static on; try_files $uri =404;
                      add_header Cache-Control "public, max-age=31536000, immutable" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Origin-Agent-Cluster "?1" always; }
  location /editor/ { root /opt/promptcut-hosted; try_files $uri /editor/index.html;
                      add_header Cache-Control "no-store" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Origin-Agent-Cluster "?1" always; }

  # 动效素材目录（server/online-catalog.mjs：在线构建把 server/catalog/<kind>/index.json 登记的 Lottie、粒子文件产出到 editor/catalog/）。
  # 卡片参数里存的是同源绝对路径 /catalog/<kind>/<名>.json（桌面由开发服务器中间件提供），在线由这里提供。
  # 主站（编辑器页的源）与 s1/s2 两个舞台源的 server 块里各加一份（舞台 iframe 里的 fetch 解析到舞台自己的源）。
  # 只放行 /catalog/(lottie|particles)/<[A-Za-z0-9-]+>.json，与桌面中间件的形状相同；其余 /catalog/… 一律 404（不列目录、不给 index.json）。
  # if 里只有 return，是 nginx 文档认可的安全用法。缓存用 no-cache（文件名不带哈希，换代后靠 ETag / Last-Modified 重新验证，同桌面中间件）。
  location ^~ /catalog/ {
    root /opt/promptcut-hosted/editor;
    if ($uri !~ "^/catalog/(lottie|particles)/[A-Za-z0-9-]+\.json$") { return 404; }
    try_files $uri =404;
    charset utf-8; charset_types application/json;
    add_header Cache-Control "no-cache" always; add_header Referrer-Policy "no-referrer" always; add_header X-Content-Type-Options "nosniff" always; add_header Origin-Agent-Cluster "?1" always;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = {{DOMAIN}}) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name {{DOMAIN}};
    return 404; # managed by Certbot


}
