# 由 scripts/gen-stage-policy-nginx.mjs 生成,不要手改;策略原文在 src/online/stagePolicy.mjs。
# 舞台源(s1 / s2)的 server 块里每个 location 都 include 这一份(nginx 的 add_header 不跨层合并:location 里只要有一条
# add_header,server 层的就全不继承,所以放在 location 里 include,与该 location 自己的 Cache-Control 并列)。
add_header Content-Security-Policy "default-src 'none'; script-src 'self' http: https: 'unsafe-eval'; style-src 'self' http: https: 'unsafe-inline'; img-src 'self' http: https: data: blob:; media-src 'self' http: https: data: blob:; font-src 'self' http: https: data:; connect-src 'self' http: https: ws: wss:; worker-src blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://{{DOMAIN}}" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Origin-Agent-Cluster "?1" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
