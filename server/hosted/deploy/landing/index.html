<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisuHive</title>
<meta name="description" content="VisuHive：用提示词做视频，和团队在浏览器里一起改。">
<style>
  :root { --bg: #f6f7f9; --fg: #14161a; --muted: #5d6470; --card: #ffffff; --line: #e3e6eb; --accent: #2f6bff; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1014; --fg: #eef0f4; --muted: #9aa3b2; --card: #171a21; --line: #262b35; --accent: #5b8cff; --accent-fg: #0b0d12; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; place-items: center; padding: 16px; }
  main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 40px 32px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: .02em; }
  p { margin: 0 auto; max-width: 30em; color: var(--muted); }
  .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 11px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; border: 1px solid var(--line); color: var(--fg); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 56 56" role="img" aria-label="VisuHive">
    <path d="M28 4 49 16v24L28 52 7 40V16z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M23 20v16l14-8z" fill="currentColor"/>
  </svg>
  <h1>VisuHive</h1>
  <p>用提示词做视频，和团队在浏览器里一起改。</p>
  <div class="actions">
    <a class="btn primary" href="https://149-88-94-84.sslip.io/editor/">打开在线编辑器</a>
  </div>
  <footer>加入别人的项目需要邀请链接，或项目名与项目密码。</footer>
</main>
</body>
</html>
