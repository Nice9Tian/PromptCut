# 落地页（visuhive.com）：发一张静态页。它不碰 promptcut、promptcut-stages 两个站点。
# 放置：/etc/nginx/sites-available/landing，链接进 sites-enabled；页面放 /var/www/landing/index.html
#       （源文件 server/hosted/deploy/landing/index.html）。
# 证书：certbot certonly --nginx -d visuhive.com（www 的解析指过来之后加 -d www.visuhive.com --expand 重签，
#       再把下面两处 server_name 补上 www.visuhive.com）。certbot.timer 自动续期。

# 没有匹配到别的站点的域名（包括裸 IP）在 80 端口上落到这里，也发这张页。
server {
  listen 80 default_server;
  server_name _;

  root /var/www/landing;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = / { try_files /index.html =404; }
  location / { return 302 /; }
}

# visuhive.com 的 http 一律跳到 https
server {
  listen 80;
  server_name visuhive.com;
  return 301 https://visuhive.com$request_uri;
}

server {
  listen 443 ssl;
  server_name visuhive.com;

  ssl_certificate /etc/letsencrypt/live/visuhive.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/visuhive.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/landing;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = / { try_files /index.html =404; }
  location / { return 302 /; }
}
