# 落地页：没有匹配到别的站点的域名（包括裸 IP）在 80 端口上都落到这里，发一张静态页。
# 用途：新域名的 A 记录指过来之后先有个能看的页面；它不碰 promptcut、promptcut-stages 两个站点。
# 放置：/etc/nginx/sites-available/landing，链接进 sites-enabled；页面放 /var/www/landing/index.html
#       （源文件 server/hosted/deploy/landing/index.html）。
# 域名定了、解析生效之后再加 HTTPS：把下面的 server_name 换成真实域名并另起一个 443 的 server，
#       证书用 certbot certonly --nginx -d <域名> -d www.<域名> 签。
server {
  listen 80 default_server;
  server_name _;

  root /var/www/landing;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = / { try_files /index.html =404; }
  location / { return 302 /; }
}
