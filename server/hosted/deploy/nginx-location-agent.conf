# 云端 Agent 服务的路由片段(契约 docs/plan/cloud-agent-contract.md 第 10.1 节)。
# 放进主站那个 `server { server_name {{DOMAIN}}; … }` 块里(nginx-site-promptcut.conf 的第一个 server 块,与 /hosted、/media 并排)。
# 两个舞台源(s1、s2,nginx-site-promptcut-stages.conf)的 server 块**不加**:舞台里跑的是卡片代码,够不着 Agent 服务。
# 占位符:{{BIND_ADDR}} 同主站模板(回环地址),{{AGENT_PORT}} 是 Agent 服务的端口(缺省 8790)。
#
# - 事件流是 SSE:关掉代理缓冲(服务另发 `X-Accel-Buffering: no`),读超时放长(两次读之间的间隔;服务每 15 秒发一行 ping);
# - `proxy_http_version 1.1` 加空的 `Connection`:节点上的 nginx(1.18)缺省对上游用 1.0,长连接与分块都要 1.1;
# - 请求体上限 5m(服务自己只收 256 KiB,超了回 413);
# - 跨源:服务自己答预检、自己发 `Access-Control-Allow-*`(桌面版的页面从本机源来打),这里不加也不改这几个头;
# - 鉴权只看 `Authorization` 里的委托票据,nginx 原样转发,不记进访问日志(缺省的日志格式不含请求头)。
location /agent/ {
  rewrite ^/agent/?(.*)$ /$1 break;
  proxy_bind {{BIND_ADDR}};
  proxy_pass http://{{BIND_ADDR}}:{{AGENT_PORT}};
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 5m;
  add_header Referrer-Policy "no-referrer" always;
}
